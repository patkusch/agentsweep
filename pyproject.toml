[project]
name = "agentsweep"
version = "0.1.0"
description = "See what your AI agent tools have piled up on your disk, and clear it safely. Nothing is deleted; it goes to a trash folder you can restore from."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Patricia Kusch" }]
keywords = ["ai-agents", "cleanup", "disk-space", "developer-tools", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patkusch/agentsweep"
Repository = "https://github.com/patkusch/agentsweep"
Issues = "https://github.com/patkusch/agentsweep/issues"

[project.scripts]
agentsweep = "agentsweep.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentsweep"]
